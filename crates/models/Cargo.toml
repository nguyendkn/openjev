[package]
name = "models"
version = "0.1.0"
edition = "2021"

[dependencies]
hf-hub = { version = "1.0", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
timing = { path = "../timing" }
# `reqwest` is already pulled in transitively by `hf-hub` (rustls-tls, confirmed via
# Cargo.lock — no `openssl`/`native-tls` present). Reusing it for the `laya serve` HTTP
# client (blocking, since `models`/`pipeline` are synchronous like the rest of this crate)
# avoids adding a second HTTP stack (e.g. `ureq`) for the same job.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
